<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Automotive FMEA</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        .icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 700;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        .rules {
            margin-top: 10px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #475569;
            font-size: 12px;
            line-height: 1.7;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .back a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h1>Reset Password</h1>

    <p class="subtitle">
        Create a new password for your Automotive FMEA account.
    </p>


    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}


    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}


    <form method="POST" id="resetForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your registered name"
            required
        >


        <label for="organisation">
            Organisation
        </label>

        <input
            type="text"
            id="organisation"
            name="organisation"
            value="Antolin"
            required
        >


        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            required
            minlength="8"
        >


        <div class="rules">

            <strong>Password requirements:</strong><br>

            • Minimum 8 characters<br>
            • At least 1 uppercase letter<br>
            • At least 1 number<br>
            • At least 1 special symbol

        </div>


        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
            minlength="8"
        >


        <button type="submit">
            Create New Password
        </button>

    </form>


    <div class="back">

        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>

    </div>

</div>


<script>

document
    .getElementById("resetForm")
    .addEventListener("submit", function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm_password").value;


        const passwordPattern =
            /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;


        if (!passwordPattern.test(password)) {

            event.preventDefault();

            alert(
                "Password must contain at least 8 characters, " +
                "1 uppercase letter, 1 number and 1 special symbol."
            );

            return;
        }


        if (password !== confirmPassword) {

            event.preventDefault();

            alert("Passwords do not match.");

        }

    });

</script>

</body>
</html>
